<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Меню</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: var(--tg-theme-bg-color, #1c1c1e);
            color: var(--tg-theme-text-color, #ffffff);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .profile {
            text-align: center;
            margin-bottom: 30px;
        }
        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(45deg, #ff8c00, #ff2a00);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
            margin: 0 auto 10px;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            width: 100%;
            max-width: 400px;
        }
        .btn {
            background-color: var(--tg-theme-secondary-bg-color, #2c2c2e);
            padding: 20px 10px;
            border-radius: 15px;
            text-align: center;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            color: inherit;
            transition: 0.2s;
        }
        .btn:active {
            opacity: 0.7;
            transform: scale(0.95);
        }
        .btn span {
            display: block;
            font-size: 24px;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
    <div class="profile">
        <div class="avatar">👤</div>
        <h2 id="user_name">Загрузка...</h2>
        <p>ID: <span id="user_id"></span></p>
    </div>

    <div class="grid">
        <button class="btn" onclick="sendData('mute')"><span>🔇</span>.mute</button>
        <button class="btn" onclick="sendData('snos')"><span>💀</span>.snos</button>
        <button class="btn" onclick="sendData('exif')"><span>📸</span>.exif</button>
        <button class="btn" onclick="sendData('troll')"><span>🤡</span>.troll</button>
        <button class="btn" onclick="sendData('gen')"><span>🔑</span>Ключи</button>
        <button class="btn" onclick="sendData('stat')"><span>📊</span>Стата</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand(); // Развернуть на весь экран

        // Показываем имя пользователя
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            document.getElementById('user_name').innerText = tg.initDataUnsafe.user.first_name;
            document.getElementById('user_id').innerText = tg.initDataUnsafe.user.id;
        } else {
            document.getElementById('user_name').innerText = "Тестовый режим";
        }

        // Отправка данных боту при нажатии на кнопку
        function sendData(action) {
            tg.sendData(action); 
            // tg.close(); // Если хочешь, чтобы окно закрывалось после нажатия
        }
    </script>
</body>
</html>
